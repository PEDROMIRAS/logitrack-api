name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: logitrack
          POSTGRES_USER: logitrack
          POSTGRES_PASSWORD: logitrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logitrack"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Tests
        run: mvn -B verify
