name: CI

on:
  # Las ramas se prueban por su PR; push solo en main evita ejecutar todo dos veces
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: logitrack
          POSTGRES_USER: logitrack
          POSTGRES_PASSWORD: logitrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logitrack"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Tests
        run: ./mvnw -B verify
