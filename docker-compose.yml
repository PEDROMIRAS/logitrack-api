services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: logitrack
      POSTGRES_USER: logitrack
      POSTGRES_PASSWORD: logitrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logitrack -d logitrack"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/logitrack
      DATABASE_USERNAME: logitrack
      DATABASE_PASSWORD: logitrack
    ports:
      - "8080:8080"

volumes:
  pgdata:
